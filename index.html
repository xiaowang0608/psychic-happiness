<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌷 温柔成长工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌷</text></svg>">
<style>
/* ===== CSS Variables ===== */
:root {
  --bg:#faf7f3;--bg-card:#fff;--bg-sidebar:#f5f0ea;--bg-hover:#efe8e0;
  --text:#3d3645;--text2:#8c8596;--text3:#b8b0be;
  --accent:#c0a49b;--accent2:#e2d2ca;--accent3:#f0e6e2;
  --border:#e8e0d8;--shadow:0 2px 16px rgba(80,60,40,.06);--shadow2:0 8px 32px rgba(80,60,40,.08);
  --green:#8fb89a;--green2:#d4e8d8;--pink:#d4a0a0;--pink2:#f5e3e3;
  --blue:#99b4c4;--blue2:#dce8ef;--gold:#cca860;--gold2:#f5ebd0;
  --red:#d47878;--red2:#f5d8d8;--orange:#d4a878;--orange2:#f5e8d8;
  --r:16px;--r2:10px;--t:0.25s cubic-bezier(0.4,0,0.2,1);
  --font:system-ui,-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei','Segoe UI',Roboto,'Helvetica Neue',Arial,'Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji',sans-serif;
}
[data-theme="dark"] {
  --bg:#1b1b22;--bg-card:#25252e;--bg-sidebar:#1f1f27;--bg-hover:#2a2a35;
  --text:#d8d3de;--text2:#9e97a8;--text3:#6b6575;
  --accent:#b49eb8;--accent2:#3d3645;--accent3:#2d2835;
  --border:#333345;--shadow:0 2px 16px rgba(0,0,0,.25);--shadow2:0 8px 32px rgba(0,0,0,.35);
  --green:#6d9d78;--green2:#243528;--pink:#b08080;--pink2:#342525;
  --blue:#7993a3;--blue2:#252d33;--gold:#a88a50;--gold2:#352d1f;
  --red:#a86868;--red2:#302020;--orange:#a08060;--orange2:#302820;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow:hidden;height:100vh;transition:background var(--t),color var(--t);-webkit-tap-highlight-color:transparent;}
.app{display:flex;height:100vh;overflow:hidden;}
/* Sidebar */
.sidebar{width:260px;min-width:260px;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:all var(--t);z-index:10;}
.sidebar-header{padding:20px 18px 14px;border-bottom:1px solid var(--border);}
.sidebar-header h1{font-size:1.1rem;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:8px;}
.sidebar-header .sub{font-size:.72rem;color:var(--text3);margin-top:3px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 8px;}
.nav-sec{margin-bottom:4px;}
.nav-sec-title{font-size:.68rem;text-transform:uppercase;color:var(--text3);padding:8px 12px 4px;letter-spacing:.05em;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r2);cursor:pointer;transition:all var(--t);font-size:.83rem;color:var(--text2);border:none;background:none;width:100%;text-align:left;font-family:var(--font);position:relative;}
.nav-item:hover{background:var(--bg-hover);color:var(--text);}
.nav-item.active{background:var(--accent);color:#fff;font-weight:500;}
.nav-item .ic{font-size:1.1rem;width:22px;text-align:center;flex-shrink:0;}
.nav-item .cnt{margin-left:auto;font-size:.68rem;background:var(--green2);color:var(--green);padding:2px 7px;border-radius:20px;min-width:20px;text-align:center;}
.nav-special{margin-top:14px;border-top:1px solid var(--border);padding-top:8px;}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{padding:12px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--bg);gap:12px;flex-shrink:0;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar .pg-icon{font-size:1.35rem;}
.topbar .pg-title{font-size:1.15rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);cursor:pointer;font-size:.78rem;transition:all var(--t);font-family:var(--font);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.btn:hover{background:var(--bg-hover);border-color:var(--accent);}
.btn-pri{background:var(--accent);color:#fff;border:none;}
.btn-pri:hover{opacity:.85;}
.btn-sm{padding:4px 10px;font-size:.72rem;}
.btn-ico{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:1.1rem;}
.mode-badge{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:.73rem;font-weight:500;cursor:pointer;}
.mode-norm{background:var(--blue2);color:var(--blue);}
.mode-slack{background:var(--pink2);color:var(--pink);}
.content-area{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth;}

/* Modules */
.mod-intro{background:var(--bg-card);border-radius:var(--r);padding:14px 20px;box-shadow:var(--shadow);font-size:.83rem;color:var(--text2);line-height:1.7;border-left:3px solid var(--accent);}
.task-group{background:var(--bg-card);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);}
.tg-title{font-size:.88rem;font-weight:600;margin-bottom:12px;color:var(--accent);display:flex;align-items:center;gap:6px;}
.task-list{list-style:none;display:flex;flex-direction:column;gap:6px;}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:var(--r2);background:var(--bg);transition:all var(--t);border:1px solid transparent;}
.task-item:hover{border-color:var(--border);}
.task-item.done{opacity:.6;}
.task-item.done .task-txt{text-decoration:line-through;color:var(--text3);}
.task-check{width:22px;height:22px;min-width:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:.65rem;margin-top:2px;user-select:none;}
.task-check:hover{border-color:var(--accent);transform:scale(1.1);}
.task-check.checked{background:var(--green);border-color:var(--green);color:#fff;}
.task-check:active{transform:scale(.9);}
.task-body{flex:1;min-width:0;}
.task-txt{font-size:.83rem;line-height:1.5;word-break:break-word;}
.task-sub{font-size:.7rem;color:var(--text3);margin-top:1px;}
.xp-tag{display:inline-block;font-size:.62rem;background:var(--gold2);color:var(--gold);padding:1px 6px;border-radius:10px;margin-left:6px;font-weight:500;}
.task-acts{display:flex;gap:2px;opacity:0;transition:opacity var(--t);}
.task-item:hover .task-acts{opacity:1;}
@media(hover:none){.task-acts{opacity:1;}}
.tbtn{width:28px;height:28px;border-radius:50%;border:none;background:transparent;cursor:pointer;font-size:.8rem;color:var(--text3);transition:all var(--t);display:flex;align-items:center;justify-content:center;}
.tbtn:hover{background:var(--bg-hover);color:var(--text);}
.tbtn.del:hover{background:var(--pink2);color:var(--pink);}
.add-form{display:flex;gap:8px;margin-top:10px;}
.add-input{flex:1;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.78rem;font-family:var(--font);outline:none;transition:border var(--t);}
.add-input:focus{border-color:var(--accent);}
.add-input::placeholder{color:var(--text3);}

/* Water */
.water-grid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.water-cup{width:42px;height:50px;border-radius:8px 8px 12px 12px;background:var(--bg);border:2px solid var(--border);cursor:pointer;transition:all var(--t);display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.water-cup.filled{background:var(--blue2);border-color:var(--blue);}
.water-cup:hover{transform:scale(1.05);}
.water-actions{margin-top:10px;display:flex;gap:8px;align-items:center;}

/* Stickers */
.sticker-stats{text-align:center;padding:16px 20px;font-size:.85rem;color:var(--text2);background:var(--bg-card);border-radius:var(--r);box-shadow:var(--shadow);}
.sticker-theme{margin-bottom:16px;}
.sticker-theme h3{font-size:.88rem;font-weight:600;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px;}
.sticker-card{aspect-ratio:1;border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2rem;transition:all var(--t);position:relative;border:2px solid transparent;user-select:none;}
.sticker-card.owned{background:var(--bg-card);box-shadow:var(--shadow);border-color:var(--border);cursor:grab;}
.sticker-card.owned:active{cursor:grabbing;}
.sticker-card.rare{border-color:var(--gold);box-shadow:0 2px 14px rgba(200,160,60,.15);}
.sticker-card.locked{background:var(--bg);filter:grayscale(1);opacity:.35;cursor:default;}
.sticker-card .se{font-size:2rem;}
.sticker-card .sn{font-size:.62rem;color:var(--text3);margin-top:3px;text-align:center;line-height:1.2;}
.sticker-card .rb{position:absolute;top:-5px;right:-5px;font-size:.65rem;background:var(--bg-card);border-radius:50%;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.1);}

/* Achievements */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.ach-card{background:var(--bg-card);border-radius:var(--r);padding:20px;text-align:center;box-shadow:var(--shadow);transition:all var(--t);border:2px solid var(--border);}
.ach-card.unlocked{border-color:var(--accent);box-shadow:0 4px 24px rgba(192,164,155,.12);}
.ach-card.locked{filter:grayscale(.7);opacity:.5;}
.ach-icon{font-size:2.4rem;margin-bottom:8px;}
.ach-name{font-weight:600;font-size:.88rem;margin-bottom:3px;}
.ach-desc{font-size:.72rem;color:var(--text3);}
.ach-prog{margin-top:10px;font-size:.7rem;color:var(--accent);}

/* Progress Bar */
.pbar{height:4px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden;}
.pfill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s ease;}

/* Mood */
.mood-picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.mood-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--bg);font-size:1.2rem;cursor:pointer;transition:all var(--t);display:flex;align-items:center;justify-content:center;}
.mood-btn:hover,.mood-btn.sel{border-color:var(--accent);background:var(--accent3);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px);}
.modal{background:var(--bg-card);border-radius:var(--r);padding:26px;max-width:520px;width:92%;box-shadow:var(--shadow2);max-height:80vh;overflow-y:auto;}
.modal h3{margin-bottom:14px;color:var(--accent);font-size:1.1rem;}
.modal-close{float:right;border:none;background:none;font-size:1.3rem;cursor:pointer;color:var(--text3);padding:4px;line-height:1;}
.review-stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem;}
.review-stat:last-child{border:none;}

/* Celebration */
.celeb-layer{position:fixed;inset:0;pointer-events:none;z-index:200;}
.celeb-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;animation:popUp .5s ease,fadeUp .5s ease 1.6s forwards;}
.celeb-msg-inner{font-size:1.05rem;font-weight:500;color:var(--accent);background:var(--bg-card);padding:14px 26px;border-radius:30px;box-shadow:var(--shadow2);white-space:nowrap;}
@keyframes popUp{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}70%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes fadeUp{to{opacity:0;transform:translate(-50%,calc(-50% - 20px))}}
.spark{position:absolute;pointer-events:none;animation:fly 1.1s ease-out forwards;}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}

/* Textarea */
.ta{width:100%;min-height:60px;padding:10px 14px;border-radius:var(--r2);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--font);font-size:.8rem;resize:vertical;outline:none;}
.ta:focus{border-color:var(--accent);}

/* ===== Dashboard Cards ===== */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:18px;}
.dash-card{background:var(--bg-card);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;transition:all var(--t);border:1px solid transparent;}
.dash-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow2);}
.dash-card-ico{font-size:2rem;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:var(--r2);background:var(--accent3);flex-shrink:0;}
.dash-card-info{flex:1;}
.dash-card-title{font-size:.78rem;color:var(--text2);}
.dash-card-val{font-size:1.3rem;font-weight:600;}
.dash-card-sub{font-size:.68rem;color:var(--text3);}

/* ===== NEW: Word Progress ===== */
.word-bar-wrap{margin-bottom:14px;}
.word-bar-label{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;margin-bottom:4px;color:var(--text2);}
.word-bar-label b{color:var(--accent);}
.word-pbar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin-bottom:4px;}
.word-pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.6rem;color:#fff;font-weight:600;min-width:28px;}
.word-daily{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;}
.word-stat{flex:1;min-width:100px;background:var(--bg);border-radius:var(--r2);padding:10px 12px;text-align:center;}
.word-stat .ws-val{font-size:1.1rem;font-weight:600;color:var(--accent);}
.word-stat .ws-label{font-size:.68rem;color:var(--text3);}
.word-review-list{max-height:120px;overflow-y:auto;margin-top:6px;font-size:.73rem;}
.word-review-item{padding:4px 0;border-bottom:1px solid var(--border);color:var(--text2);display:flex;justify-content:space-between;}
.word-phase{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:500;}
.word-phase.phase1{background:#e8f0e8;color:#6d9d78;}
.word-phase.phase2{background:#f0e8e8;color:#a88080;}
.word-phase.phase3{background:#e8e8f0;color:#8088a0;}
[data-theme="dark"] .word-phase.phase1{background:#1a2a1a;color:#8fba8f}
[data-theme="dark"] .word-phase.phase2{background:#2a1a1a;color:#ba8f8f}
[data-theme="dark"] .word-phase.phase3{background:#1a1a2a;color:#8f8fba}

/* ===== NEW: Video Push v2 ===== */
.video-push-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;}
.video-push-tab{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-size:.73rem;font-family:var(--font);transition:all var(--t);}
.video-push-tab:hover,.video-push-tab.sel{border-color:var(--accent);background:var(--accent3);color:var(--text);}
.video-history-panel{background:var(--bg);border-radius:var(--r2);padding:12px;max-height:220px;overflow-y:auto;margin-top:10px;}
.video-history-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.78rem;}
.video-history-item .vh-date{font-size:.68rem;color:var(--text3);min-width:48px;}
.video-history-item .vh-cat{font-size:.6rem;padding:2px 6px;border-radius:8px;min-width:fit-content;}
.vh-fitness{background:var(--green2);color:var(--green);}
.vh-digital{background:var(--blue2);color:var(--blue);}
.vh-news{background:var(--orange2);color:var(--orange);}
/* Import Panel */
.import-panel{border:2px dashed var(--border);border-radius:var(--r);padding:20px;text-align:center;background:var(--bg);transition:all var(--t);cursor:pointer;}
.import-panel:hover{border-color:var(--accent);background:var(--accent3);}
.import-panel textarea{width:100%;min-height:100px;padding:12px;border-radius:var(--r2);border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-family:var(--font);font-size:.78rem;resize:vertical;margin-top:8px;outline:none;}
.import-panel textarea:focus{border-color:var(--accent);}
.import-panel .hint{font-size:.7rem;color:var(--text3);margin-top:6px;line-height:1.6;}
.tag-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.tag-chip{padding:3px 10px;border-radius:12px;font-size:.68rem;cursor:pointer;transition:all var(--t);border:1px solid var(--border);background:var(--bg);color:var(--text2);}
.tag-chip:hover,.tag-chip.sel{border-color:var(--accent);background:var(--accent3);color:var(--text);}
.tag-count{font-size:.6rem;color:var(--text3);margin-left:3px;}
.up-card{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:var(--r2);margin-bottom:6px;border:1px solid var(--border);}
.up-card .up-uid{font-size:.7rem;color:var(--text3);font-family:monospace;}
.up-card .up-name{font-weight:500;font-size:.82rem;}
.pref-bar{margin-top:4px;margin-bottom:2px;}
.pref-bar .pb-label{font-size:.68rem;color:var(--text2);min-width:60px;display:inline-block;}
.pref-bar .pb-track{display:inline-block;height:6px;background:var(--border);border-radius:3px;width:120px;vertical-align:middle;}
.pref-bar .pb-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease;min-width:4px;}

/* ===== NEW: Rotation Cards ===== */
.rotation-card{background:var(--bg);border-radius:var(--r2);padding:14px 18px;margin-bottom:10px;border-left:3px solid var(--accent);transition:all var(--t);}
.rotation-card .rc-title{font-size:.8rem;font-weight:600;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.rotation-card .rc-body{font-size:.78rem;color:var(--text2);line-height:1.7;}
.rotation-card .rc-tag{display:inline-block;font-size:.62rem;padding:2px 8px;border-radius:10px;margin-right:4px;margin-top:4px;}
.rc-breakfast{background:var(--gold2);color:var(--gold);}
.rc-lunch{background:var(--green2);color:var(--green);}
.rc-dinner{background:var(--pink2);color:var(--pink);}
.rc-snack{background:var(--blue2);color:var(--blue);}
.rc-skincare{background:var(--accent3);color:var(--accent);}
.rc-style{background:#e8e0f0;color:#8068a0;}
[data-theme="dark"] .rc-style{background:#281e30;color:#a888c8;}

/* ===== NEW: Savings Calendar ===== */
.save-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
.save-cal-cell{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;background:var(--bg);border:1px solid var(--border);cursor:default;transition:all .15s;}
.save-cal-cell.done{background:var(--gold2);border-color:var(--gold);color:var(--gold);font-weight:600;}
.save-cal-cell.today{border:2px solid var(--accent);box-shadow:0 0 0 2px var(--accent3);}
.save-cal-cell .sc-day{font-size:.55rem;color:var(--text3);}
.save-cal-cell .sc-amt{font-size:.62rem;font-weight:500;}
.save-big-bar{margin-top:12px;margin-bottom:6px;}
.save-big-fill{height:24px;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:12px;transition:width .5s ease;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;font-weight:600;min-width:40px;}
.save-summary{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
.save-summary-card{flex:1;min-width:100px;background:var(--bg);border-radius:var(--r2);padding:10px 14px;text-align:center;}
.save-summary-card .ss-val{font-size:1.2rem;font-weight:600;color:var(--accent);}
.save-summary-card .ss-label{font-size:.68rem;color:var(--text3);}

/* ===== Pomodoro ===== */
.pomo-wrap{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
.pomo-circle-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;}
.pomo-svg{transform:rotate(-90deg);}
.pomo-bg-circle{fill:none;stroke:var(--border);stroke-width:8;}

.pomo-label{font-size:.75rem;color:var(--text2);}

.pomo-preset:hover,.pomo-preset.sel{border-color:var(--accent);background:var(--accent3);}
.pomo-info{flex:1;min-width:200px;}

.pomo-stat-val{font-size:1.2rem;font-weight:600;}
.pomo-stat-label{font-size:.68rem;color:var(--text3);}
.pomo-task-input{width:100%;}
.pomo-history{margin-top:8px;max-height:120px;overflow-y:auto;}
.pomo-history-item{font-size:.73rem;padding:4px 0;border-bottom:1px solid var(--border);color:var(--text2);}

.ai-quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.ai-qbtn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-size:.73rem;font-family:var(--font);transition:all var(--t);}
.ai-qbtn:hover{border-color:var(--accent);background:var(--accent3);color:var(--text);}
.ai-msgs{display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto;padding:8px 0;}
.ai-msg{display:flex;gap:8px;max-width:85%;animation:fadeIn .3s ease;}
.ai-msg.user{align-self:flex-end;flex-direction:row-reverse;}
.ai-msg.bot{align-self:flex-start;}
.ai-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;background:var(--accent3);flex-shrink:0;}
.ai-bubble{padding:10px 14px;border-radius:16px;font-size:.8rem;line-height:1.6;}
.ai-msg.user .ai-bubble{background:var(--accent);color:#fff;border-radius:16px 4px 16px 16px;}
.ai-msg.bot .ai-bubble{background:var(--bg);border:1px solid var(--border);border-radius:4px 16px 16px 16px;}
.ai-input-row{display:flex;gap:8px;}
.ai-input{flex:1;padding:10px 16px;border-radius:24px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.8rem;font-family:var(--font);outline:none;}
.ai-input:focus{border-color:var(--accent);}

.heatmap-wrap{overflow-x:auto;padding:4px 0;}
.heatmap-table{border-collapse:separate;border-spacing:3px;}
.heatmap-table td{width:32px;height:32px;border-radius:4px;text-align:center;font-size:.6rem;cursor:default;transition:all .2s;position:relative;}
.heatmap-table td:hover{transform:scale(1.15);z-index:1;}
.hm-0{background:var(--bg);border:1px solid var(--border);}
.hm-1{background:#e8d5ce;border:1px solid #d4beb5;}
.hm-2{background:#d4b8ad;border:1px solid #c0a49b;}

.rem-toggle{width:44px;height:24px;border-radius:12px;background:var(--border);cursor:pointer;position:relative;transition:all var(--t);border:none;}
.rem-toggle.on{background:var(--accent);}
.rem-toggle::after{content:'';width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:all var(--t);}
.rem-toggle.on::after{left:23px;}
.routine-table{width:100%;font-size:.75rem;border-collapse:collapse;margin-top:8px;}
.routine-table td{padding:6px 10px;border-bottom:1px solid var(--border);}
.routine-table td:first-child{font-weight:600;color:var(--accent);white-space:nowrap;}

.video-card .v-info{padding:10px 14px;font-size:.78rem;color:var(--text2);}
.video-url-form{display:flex;gap:8px;margin-top:8px;}

/* ===== Toast ===== */
.toast-ctr{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--bg-card);border:1px solid var(--accent);border-radius:var(--r2);padding:12px 18px;box-shadow:var(--shadow2);font-size:.83rem;animation:slideIn .3s ease;display:flex;align-items:center;gap:8px;pointer-events:auto;}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

.menu-btn{display:none;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--text);padding:2px;}

::-webkit-scrollbar{width:4px;}

// ===== Video Library Helpers =====
function getAllVideos(cat){
  // Merge user videos + template defaults (template ones only if user hasn't imported any in that category)
  const userVids = (state.userVideos||[]).filter(v=>v.cat===cat);
  const hasUserVids = userVids.length > 0;
  const templateVids = hasUserVids ? [] : DEFAULT_VIDEOS.filter(v=>v.cat===cat);
  return [...userVids, ...templateVids];
}
function getVideoPushForToday(cat){
  const vids = getAllVideos(cat);
  if(vids.length===0) return null;
  // Prioritize unwatched videos based on watch history
  const today = getToday();
  const watchLog = state.videoWatchLog || {};
  const unwatched = vids.filter(v => !watchLog[v.url+cat+getToday()]);
  const pool = unwatched.length>0 ? unwatched : vids;
  // Bias toward user's preferred tags
  const prefs = state.videoTagPrefs || {};
  const scored = pool.map(v => {
    let score = 0;
    (v.tags||[]).forEach(t => { score += (prefs[t]||0); });
    score += Math.random() * 2; // add randomness
    return { v, score };
  });
  scored.sort((a,b)=>b.score-a.score);
  return { video: scored[0].v, date: today, cat };
}
function getVideoPushHistory(cat){
  const all = state.videoPushHistory || [];
  return all.filter(h=>h.cat===cat).sort((a,b)=>b.date.localeCompare(a.date));
}
function buildWatchLogKey(vid, cat){
  return (vid.url||vid.bvid||'')+cat+getToday();
}
function markVideoWatched(cat){
  const today = getToday();
  if(!state.videoPushHistory) state.videoPushHistory = [];
  const exists = state.videoPushHistory.find(h=>h.date===today && h.cat===cat);
  if(!exists){
    const vp = getVideoPushForToday(cat);
    if(!vp) return;
    state.videoPushHistory.push({...vp, watchedAt: new Date().toISOString()});
  }
  // Update watch log and tag preferences
  const vp = getVideoPushForToday(cat);
  if(vp){
    const key = buildWatchLogKey(vp.video, cat);
    state.videoWatchLog = state.videoWatchLog || {};
    state.videoWatchLog[key] = (state.videoWatchLog[key]||0)+1;
    // Update tag preferences
    state.videoTagPrefs = state.videoTagPrefs || {};
    (vp.video.tags||[]).forEach(t => {
      state.videoTagPrefs[t] = (state.videoTagPrefs[t]||0)+1;
    });
  }
  save();
}

// ===== Import & Parse =====
function parseVideoLinks(text){
  const lines = text.split(/[\n,]+/).filter(l=>l.trim());
  const parsed = [];
  lines.forEach(line => {
    line = line.trim();
    if(!line) return;
    // Try Bilibili BV format
    const bvMatch = line.match(/BV[a-zA-Z0-9]+/);
    // Try Bilibili full URL
    const blUrl = line.match(/(https?:\/\/)?(www\.)?bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/);
    // Try Douyin share
    const dyUrl = line.match(/(https?:\/\/)?(v\.)?douyin\.com\/[a-zA-Z0-9]+/);
    if(blUrl || bvMatch){
      const bvid = (blUrl&&blUrl[3]) || (bvMatch&&bvMatch[0]) || line;
      parsed.push({ platform:'bilibili', bvid, url:`https://player.bilibili.com/player.html?bvid=${bvid}`, rawLine:line, title:'' });
    } else if(dyUrl){
      parsed.push({ platform:'douyin', bvid:'', url:line, rawLine:line, title:'' });
    } else if (line.includes('http')){
      parsed.push({ platform:'other', bvid:'', url:line, rawLine:line, title:'' });
    }
  });
  return parsed;
}
function importVideos(cat, text){
  const parsed = parseVideoLinks(text);
  if(parsed.length===0){ showToast('❌ 没有识别到有效的B站/抖音视频链接'); return; }
  state.userVideos = state.userVideos || [];
  // Auto-tag based on category
  const catTags = VIDEO_CATEGORIES[cat]?.tags || [];
  let added = 0;
  parsed.forEach(p => {
    // Check duplicate
    const exists = state.userVideos.find(v=>v.bvid===p.bvid && v.cat===cat);
    if(exists) return;
    // Try to guess tags from URL/title
    const guessedTags = [];
    catTags.forEach(ct => {
      if((p.title||'').includes(ct) || (p.rawLine||'').includes(ct)) guessedTags.push(ct);
    });
    state.userVideos.push({
      title: p.title || `视频 ${state.userVideos.length+1}`,
      platform: p.platform,
      url: p.url,
      bvid: p.bvid,
      cat,
      tags: guessedTags.length>0 ? guessedTags : [cat],
      source: 'user',
      addedAt: new Date().toISOString(),
    });
    added++;
  });
  save();
  showToast(`✅ 成功导入 ${added} 个视频到「${VIDEO_CATEGORIES[cat]?.label||cat}」`);
  render();
}

function addUpSub(){

  const nameInput = document.getElementById('upName');

  const uid = uidInput?.value?.trim();

  state.upSubs.push({ uid, name, cat, addedAt: new Date().toISOString() });
  save();
  showToast(`✅ 已订阅 ${name}（UID: ${uid}）`);
  // Try to fetch their public videos
  fetchUpVideos(uid, name, cat);
  render();
}
async function fetchUpVideos(uid, name, cat){
  try{
    const resp = await fetch(`https://api.bilibili.com/x/space/arc/search?mid=${uid}&ps=10&pn=1`, { mode:'cors' });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    if(data.code!==0 || !data.data?.list?.vlist) throw new Error('API error');
    const vlist = data.data.list.vlist;
    state.userVideos = state.userVideos || [];
    const catTags = VIDEO_CATEGORIES[cat]?.tags || [];
    let added = 0;
    vlist.forEach(v => {
      const exists = state.userVideos.find(uv=>uv.bvid===v.bvid && uv.cat===cat);
      if(exists) return;
      const guessedTags = [cat];
      catTags.forEach(ct => {
        if((v.title||'').includes(ct)) guessedTags.push(ct);
      });
      state.userVideos.push({
        title: v.title||'视频',
        platform:'bilibili',
        url:`https://player.bilibili.com/player.html?bvid=${v.bvid}`,
        bvid: v.bvid,
        cat,
        tags: guessedTags,
        source: 'up',
        upName: name,
        addedAt: new Date().toISOString(),
      });
      added++;
    });
    save();
    if(added>0) showToast(`📥 从「${name}」获取了 ${added} 个视频`);
  }catch(e){
    console.log('Bilibili API fetch failed:', e.message);
    showToast(`⚠️ 无法自动获取「${name}」的视频，但已保存订阅。可以手动粘贴视频链接导入~`);
  }
}
function refreshUpVideos(){
  state.upSubs = state.upSubs || [];
  if(state.upSubs.length===0){ showToast('还没有订阅任何UP主'); return; }
  showToast('🔄 正在刷新UP主视频...');
  state.upSubs.forEach(sub => { fetchUpVideos(sub.uid, sub.name, sub.cat); });
}
function removeUpSub(i){
  if(!confirm('取消订阅？')) return;

}

// ===== Tag Management =====
function addTagToVideo(idx, tag){
  state.userVideos = state.userVideos || [];
  const vid = state.userVideos[idx];
  if(!vid) return;
  vid.tags = vid.tags || [];
  if(vid.tags.includes(tag)){
    vid.tags = vid.tags.filter(t=>t!==tag);
  } else {
    vid.tags.push(tag);
  }
  save();
  render();
}
function getUserVideoTagStats(cat){
  const vids = (state.userVideos||[]).filter(v=>v.cat===cat);
  const tagCount = {};
  vids.forEach(v => {(v.tags||[]).forEach(t=>{tagCount[t]=(tagCount[t]||0)+1;});});
  const prefs = state.videoTagPrefs || {};
  const entries = Object.entries(tagCount).map(([tag,count])=>({tag,count,pref:prefs[tag]||0}));
  entries.sort((a,b)=>b.pref-b.pref||b.count-a.count);
  return entries;
}
function getPreferenceSummary(cat){
  const stats = getUserVideoTagStats(cat);
  const maxPref = stats.length>0 ? Math.max(1, stats[0].pref) : 1;
  return stats.slice(0,5).map(s=>{
    const pct = Math.round(s.pref/maxPref*100);
    return { ...s, pct };
  });
}
function clearTemplateVideos(cat){
  // After user imports, clear template videos for that category
  DEFAULT_VIDEOS = DEFAULT_VIDEOS.filter(v=>v.cat!==cat);
  render();
}

  const pct = Math.round(totalSaved / planTarget * 100);
  return { totalSaved, doneDays, planTarget, pct, today };
}

function learnWords(){
  const stats = getWordStats();
  const phase = WORD_PLAN.phases[stats.phase-1];
  const dailyTarget = phase.dailyNew;
  state.wordsDailyNew = dailyTarget;
  state.wordsLearned = (state.wordsLearned||0) + dailyTarget;
  if(state.wordsLearned > WORD_PLAN.totalWords) state.wordsLearned = WORD_PLAN.totalWords;
  // Phase progression
  if(state.wordsLearned >= 1500 && (state.wordPhase||1)===1) state.wordPhase = 2;
  if(state.wordsLearned >= 3000 && (state.wordPhase||1)===2) state.wordPhase = 3;
  if(state.wordsLearned >= 4500) state.wordPhase = 3;
  const today = getToday();
  if(!state.wordHistory) state.wordHistory = {};
  state.wordHistory[today] = dailyTarget;
  state.st.totalDone++;
  trySticker();celebrate();
  save();render();
}

function reviewWords(){
  const today = getToday();
  if(!state.wordReviewsDone) state.wordReviewsDone = {};
  const cnt = (state.wordReviewsDone[today]||0) + 50;
  state.wordReviewsDone[today] = cnt;
  state.st.totalDone++;
  showToast(`📖 已复习 ${cnt} 个旧词，继续加油！`);
  trySticker();celebrate();
  save();render();
}

function resetWordProgress(){
  if(confirm('确定要重置背词进度吗？贴纸和成就不会丢失。')){
    state.wordsLearned = 0; state.wordsDailyNew = 0; state.wordPhase = 1; state.wordHistory = {}; state.wordReviewsDone = {};
    save();render();
  }
}

  const today = dayOfMonth();
  if(!state.savingsDays) state.savingsDays = {};
  if(state.savingsDays[today]) return;
  state.savingsDays[today] = true;

  const doneDays = Object.keys(state.savingsDays).length;
  if(doneDays >= 30 && !state.savingsBonus){
    state.savingsBonus = 65; // 30天存满额外奖励

  state.st.savedThisMonth = 1;
  state.st.totalDone++;
  trySticker();checkAch();celebrate();
  save();render();
}

function quickAddVideo(cat){
  const title = document.getElementById('qvTitle')?.value?.trim();
  const link = document.getElementById('qvLink')?.value?.trim();
  if(!title||!link){ showToast('请填写标题和链接'); return; }
  const bvMatch = link.match(/BV[a-zA-Z0-9]+/);
  const bvid = bvMatch ? bvMatch[0] : '';
  let url = link;
  if(link.includes('bilibili.com/video/')&&bvid){
    url = `https://player.bilibili.com/player.html?bvid=${bvid}`;
  }
  state.userVideos = state.userVideos || [];
  const catTags = VIDEO_CATEGORIES[cat]?.tags || [];
  const guessedTags = [cat];
  catTags.forEach(ct => { if(title.includes(ct)||link.includes(ct)) guessedTags.push(ct); });
  state.userVideos.push({title,platform:'bilibili',url,bvid,cat,tags:guessedTags,source:'user',addedAt:new Date().toISOString()});
  save();
  showToast(`✅ 已添加「${title}」`);
  render();
}

function renderPomo(){
  document.getElementById('pgIcon').textContent='⏱️';
  document.getElementById('pgTitle').textContent='番茄钟专注计时';
  const totalSecs=pomoRunning?pomoTotal*60:25*60;
  const remaining=pomoRunning?pomoRemaining:25*60;
  const r=80,cx=100,cy=100,circ=2*Math.PI*r;
  const progress=remaining/totalSecs;
  const dashOffset=circ*(1-progress);
  const mins=Math.floor(remaining/60),secs=remaining%60;
  const timeStr=`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  const todayP=state.pomodoro.today||0,totalP=state.pomodoro.total||0;
  const h=`
  <div class="task-group">
    <div class="pomo-wrap">
      <div class="pomo-circle-wrap">
        <svg class="pomo-svg" width="200" height="200" viewBox="0 0 200 200">
          <circle class="pomo-bg-circle" cx="${cx}" cy="${cy}" r="${r}"/>
          <circle class="pomo-fg-circle${pomoIsBreak?' break-mode':''}" cx="${cx}" cy="${cy}" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${dashOffset}"/>
        </svg>
        <div class="pomo-time-text">${timeStr}</div>
        <div class="pomo-label">${pomoIsBreak?'☕ 休息时间':'🍅 专注中'} · ${pomoRunning?(pomoIsBreak?'休息':'专注'):'准备开始'}</div>

          <button class="pomo-preset${!pomoRunning&&pomoTotal===25?' sel':''}" onclick="setPomo(25)">25分钟</button>
          <button class="pomo-preset${!pomoRunning&&pomoTotal===45?' sel':''}" onclick="setPomo(45)">45分钟</button>
          <button class="pomo-preset${!pomoRunning&&pomoTotal===50?' sel':''}" onclick="setPomo(50)">50分钟</button>
        </div>
        <div class="pomo-stats">
          <div class="pomo-stat"><div class="pomo-stat-val">${todayP}</div><div class="pomo-stat-label">今日番茄</div></div>
          <div class="pomo-stat"><div class="pomo-stat-val">${totalP}</div><div class="pomo-stat-label">累计番茄</div></div>
        </div>
        <input class="add-input pomo-task-input" id="pomoTask" placeholder="当前专注任务（如：背英语单词）" value="${state.pomodoro.task||''}" onchange="state.pomodoro.task=this.value;save()">
        <div class="pomo-controls" style="margin-top:10px;">
          ${pomoRunning?`<button class="btn btn-pri" onclick="pausePomo()">⏸️ 暂停</button><button class="btn" onclick="stopPomo()">⏹️ 停止</button>`:`<button class="btn btn-pri" onclick="startPomo(${pomoTotal||25})">▶️ 开始专注</button>`}
        </div>
      </div>
    </div>
  </div>`;
  if(state.pomodoro.history&&state.pomodoro.history.length>0){
    const hist=[...state.pomodoro.history].reverse().slice(0,10);
    let hh=`<div class="task-group"><div class="tg-title">📋 今日专注记录</div><div class="pomo-history">`;
    hist.forEach(e=>{hh+=`<div class="pomo-history-item">🍅 ${e.task||'专注'} · ${e.mins}分钟 · ${e.time}</div>`;});
    hh+=`</div></div>`;
    document.getElementById('content').innerHTML=h+hh;
  }else{document.getElementById('content').innerHTML=h;}
}

function setPomo(mins){pomoTotal=mins;renderPomo();}
function startPomo(mins){
  if(pomoRunning)return;
  pomoTotal=mins;pomoRemaining=mins*60;pomoRunning=!0;pomoIsBreak=!1;
  requestNotification();
  document.getElementById('pgIcon').textContent='⏱️';
  renderPomo();
  pomoInterval=setInterval(()=>{
    pomoRemaining--;
    if(pomoRemaining<=0){
      clearInterval(pomoInterval);pomoInterval=null;
      if(!pomoIsBreak){
        const now=new Date();
        state.pomodoro.today=(state.pomodoro.today||0)+1;
        state.pomodoro.total=(state.pomodoro.total||0)+1;
        if(!state.pomodoro.history)state.pomodoro.history=[];
        state.pomodoro.history.push({task:state.pomodoro.task||'专注',mins:pomoTotal,time:now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});
        pomoIsBreak=!0;pomoRemaining=5*60;pomoTotal=5;
        notify('🍅 番茄完成！','休息5分钟吧~');
        playBeep();
        celebrate();
        trySticker();
        save();
        renderPomo();
        pomoInterval=setInterval(()=>{
          pomoRemaining--;
          if(pomoRemaining<=0){clearInterval(pomoInterval);pomoInterval=null;pomoRunning=!1;pomoIsBreak=!1;pomoTotal=25;notify('☕ 休息结束','可以开始下一个番茄啦！');playBeep();save();renderPomo();}
          else renderPomo();
        },1000);
      }else{
        pomoRunning=!1;pomoIsBreak=!1;pomoTotal=25;
        notify('☕ 休息结束','可以开始下一个番茄啦！');
        playBeep();save();renderPomo();
      }
    }else renderPomo();
  },1000);
}
function pausePomo(){if(pomoInterval){clearInterval(pomoInterval);pomoInterval=null;}pomoRunning=!1;renderPomo();}
function stopPomo(){if(pomoInterval){clearInterval(pomoInterval);pomoInterval=null;}pomoRunning=!1;pomoIsBreak=!1;renderPomo();}
function playBeep(){
  try{const a=document.getElementById('pomoSound');if(a){a.currentTime=0;a.play().catch(()=>{});}}
  catch(e){}
}

function aiMatch(query){
  const q=query.toLowerCase();
  let bestMatch=null,bestScore=0;
  for(const[topic,entries]of Object.entries(AI_KB)){
    for(const entry of entries){
      let score=0;
      for(const kw of entry.q){
        if(q.includes(kw.toLowerCase()))score+=kw.length;
      }
      if(score>bestScore){bestScore=score;bestMatch=entry.a;}
    }
  }
  return bestMatch||'🌷 我不太确定怎么回答这个问题，但你可以试试问我：英语学习、健身塑形、护肤护发、穿搭美学、考研方向、存钱计划、舞蹈入门、电脑技能、喝水习惯、美妆技巧~';
}

  let mdHTML='';
  MODS.filter(m=>m.gs&&m.gs.length>0).forEach(m=>{const p=pen(m.id);const label=p===0?'✅ 全部完成':p<3?'🌿 少量':p<6?'📝 还有不少':p<10?'📋 任务较多':'📚 堆积';mdHTML+=`<div class="review-stat"><span>${m.ti}</span><span style="color:var(--text2)">剩余 ${p} 项 ${label}</span></div>`;});
  const ws=getWordStats();const ss=getSavingsStats();
  const h=`<div class="modal-overlay" onclick="if(event.target===this)closeReview()"><div class="modal">
    <button class="modal-close" onclick="closeReview()">✕</button><h3>📊 本周复盘报告</h3>
    <div class="review-stat"><span>📅 本周</span><span>${fmtDate(weekAgo)} ~ ${fmtDate(today)}</span></div>
    <div class="review-stat"><span>✅ 完成任务</span><span><b>${doneThisWeek}</b> 项</span></div>
    <div class="review-stat"><span>🔥 连续打卡</span><span><b>${state.st.streakDays}</b> 天</span></div>
    <div class="review-stat"><span>📖 词汇进度</span><span><b>${ws.pct}%</b>（${ws.learned}/${ws.total}词）</span></div>
    <div class="review-stat"><span>💰 本月存钱</span><span><b>¥${ss.totalSaved}</b>（${ss.doneDays}/30天）</span></div>
    <div class="review-stat"><span>🪄 贴纸</span><span><b>${state.stickers.length}</b> 张</span></div>
    <div class="review-stat"><span>🍅 番茄</span><span><b>${state.pomodoro.today||0}</b> 个/今日</span></div>
    <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:8px;"><div style="font-weight:600;color:var(--accent);margin-bottom:6px;">📋 各模块进度</div>${mdHTML}</div>
    <div style="margin-top:10px;font-size:.75rem;color:var(--text3);text-align:center;padding:8px;background:var(--bg);border-radius:var(--r2);">💡 复盘不是为了批评自己，而是为了更温柔地前进。</div>
  </div></div>`;
  document.getElementById('modalCtr').innerHTML=h;
}
function closeReview(){document.getElementById('modalCtr').innerHTML='';}
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

// ===== NOTIFICATIONS =====
function requestNotification(){if('Notification' in window && Notification.permission==='default'){Notification.requestPermission();}}
function notify(title,body){if('Notification' in window && Notification.permission==='granted'){try{new Notification(title,{body,icon:'🌷'});}catch(e){}}}

// ===== INIT =====
function init(){
  document.documentElement.setAttribute('data-theme',theme);
  document.getElementById('themeBtn').textContent=theme==='dark'?'☀️':'🌙';
  MODS.forEach(om=>{if(!state.md.find(m=>m.id===om.id)){state.md.push({id:om.id,gs:om.gs?om.gs.map(g=>({tl:g.tl,ts:g.ts.map(t=>({...t,done:!1}))})):[]});}});
  const today=getToday();
  if(state._waterDate!==today){state.water=0;state._waterDate=today;}
  // Reset daily word count
  if(state._lastWordDate!==today){state.wordsDailyNew=0;state._lastWordDate=today;}
  if(reminderInterval)clearInterval(reminderInterval);
  reminderInterval=setInterval(checkReminders,30000);checkReminders();
  setTimeout(requestNotification,1000);
  render();
}
init();
</script>
</body>
</html>
